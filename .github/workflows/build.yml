name: Build

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Build project
        run: npm run build
      - name: Show build info
        run: |
          echo "Build completed successfully"
          du -sh dist/* || true
