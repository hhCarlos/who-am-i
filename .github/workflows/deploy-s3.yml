name: Deploy to S3

on:
  workflow_call:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project 🏗️
        run: npm run build

      - name: Debug secrets presence
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then echo "❌ Missing AWS_ACCESS_KEY_ID"; else echo "✅ AWS_ACCESS_KEY_ID found"; fi
          if [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then echo "❌ Missing AWS_SECRET_ACCESS_KEY"; else echo "✅ AWS_SECRET_ACCESS_KEY found"; fi

      - name: Configure AWS Credentials 🔐
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to S3 🪣
        run: aws s3 sync ./dist s3://who-am-i-site --delete

      - name: Deployment info 🌐
        run: |
          echo "✅ Deployed from branch: $GITHUB_REF_NAME"
          echo "🔹 Commit: $GITHUB_SHA"
          echo "🔗 S3 URL: http://who-am-i-site.s3-website-us-east-1.amazonaws.com"

