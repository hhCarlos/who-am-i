name: CI Pipeline

on:
  push:
    branches: [develop, ci/**]
  pull_request:
    branches: [develop, ci/**]

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  format:
    uses: ./.github/workflows/format.yml

  test:
    uses: ./.github/workflows/test.yml

  build:
    uses: ./.github/workflows/build.yml
    needs: [lint, format, test]
  